name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: boatrace_edge
          POSTGRES_USER: boatrace_edge
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boatrace_edge -d boatrace_edge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://boatrace_edge:ci-test-password@localhost:5432/boatrace_edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pytest
      - name: Validate foundation migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/001_foundation.sql
      - name: Validate historical migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/002_historical_data.sql
      - name: Validate odds coverage migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/003_odds_coverage.sql
      - name: Ingest one real official historical race
        run: python -m boatrace_edge.ingest --date 20260226 --venue 04 --race 1
      - name: Verify historical records
        run: |
          test "$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM raw_document')" = "3"
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM entry WHERE race_id = '20260226-04-01'")" = "6"
          test "$(psql "$DATABASE_URL" -tAc "SELECT odds_status FROM race WHERE race_id = '20260226-04-01'")" = "INCOMPLETE_SOURCE_RESPONSE"
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM historical_odds WHERE race_id = '20260226-04-01'")" = "0"
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM race_result WHERE race_id = '20260226-04-01'")" = "1"
